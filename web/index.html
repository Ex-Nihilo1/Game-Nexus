<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Nexus</title>
  <link rel="stylesheet" href="lib/theme.css">
  <script src="lib/theme.js"></script>
  <script src="lib/api.js"></script>
  <script src="lib/sync.js"></script>
  <script src="lib/account.js"></script>
  <style>
    .game-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--rule);
    }
    .game-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 12px;
      border-bottom: 1px solid var(--rule);
      text-decoration: none;
    }
    .game-row:hover { background: var(--hover); }
    .thumb {
      flex: none;
      width: 82px;
      height: 82px;
    }
    .thumb svg { display: block; width: 80px; height: 80px; }
    .game-info { flex: 1; min-width: 0; }
    .game-name { display: block; font-size: 17px; font-weight: 600; }
    .game-blurb { display: block; margin-top: 4px; color: var(--ink-muted); }
    .button.credit {
      height: auto;
      flex-direction: column;
      gap: 1px;
      padding: 5px 14px;
    }
    .button.credit small { font: 11px var(--font-condensed); opacity: .8; }
    .game-credit {
      display: none;
      margin-top: 4px;
      color: var(--ink-muted);
      font: 12px var(--font-condensed);
    }
    .coming-soon {
      padding: 18px 12px;
      border-bottom: 1px dashed var(--rule);
      color: var(--ink-muted);
      font: 13px var(--font-condensed);
    }
    @media (max-width: 480px) {
      .game-row { gap: 12px; }
      .game-row .button { display: none; }
      .game-credit { display: block; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div>
        <h1 class="app-title">Game Nexus</h1>
      </div>
      <div class="theme-controls"></div>
    </header>

    <main>
      <ul class="game-list" id="game-list"></ul>
      <div class="coming-soon">More games coming. Add one in web/lib/games.js. <span id="version"></span></div>
    </main>
  </div>

  <script src="lib/games.js"></script>
  <script>
    const list = document.getElementById('game-list');
    for (const game of GAMES) {
      const li = document.createElement('li');
      // Games made by someone else credit their author inside the Play button
      // (and under the blurb on phones, where the button is hidden).
      const credit = game.author ? `by ${game.author}` : '';
      li.innerHTML =
        `<a class="game-row" href="${game.href}">` +
          `<span class="thumb paper">${game.thumb}</span>` +
          `<span class="game-info">` +
            `<span class="game-name">${game.name}</span>` +
            `<span class="game-blurb">${game.blurb}</span>` +
            (credit ? `<span class="game-credit">${credit}</span>` : '') +
          `</span>` +
          (credit
            ? `<span class="button primary credit">Play<small>${credit}</small></span>`
            : `<span class="button primary">Play</span>`) +
        `</a>`;
      list.appendChild(li);
    }
    document.getElementById('version').textContent = `· Game Nexus ${NEXUS_VERSION}`;
  </script>
</body>
</html>

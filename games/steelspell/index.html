<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steel &amp; Spell</title>
  <link rel="stylesheet" href="../../shared/theme.css">
  <script src="../../shared/theme.js"></script>
  <style>
    [hidden] { display: none !important; }

    .page {
      display: flex;
      flex-direction: column;
      max-width: 1280px;
      height: 100vh;
      height: 100dvh;
      padding: 10px 16px 14px;
    }
    .app-header { flex: none; margin-bottom: 10px; padding-bottom: 8px; }
    .app-title { font-size: 22px; }
    .back-link { margin-bottom: 2px; }

    .stage { position: relative; flex: 1 1 auto; min-height: 300px; }
    #view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 1px solid var(--rule);
      border-radius: 2px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .corner-btn {
      position: absolute;
      top: 16px;
      right: 10px;
      height: 28px;
      padding: 0 10px;
      background: var(--paper);
    }

    .active-btn {
      position: absolute;
      right: 14px;
      bottom: 14px;
      flex-direction: column;
      gap: 0;
      width: 88px;
      height: 88px;
      padding: 0;
      border-radius: 50%;
      background: conic-gradient(var(--rule) calc(var(--cd, 0) * 360deg), var(--paper) 0);
      font: 600 12px var(--font-condensed);
      line-height: 1.2;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .active-btn.ready { border: 2px solid var(--red-pencil); }
    .active-btn .time { font: 15px var(--font-figure); font-variant-numeric: tabular-nums; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      overflow: auto;
      padding: 12px;
      background: var(--desk);
      background: color-mix(in srgb, var(--desk) 72%, transparent);
    }
    .panel {
      width: min(780px, 100%);
      margin: auto;
      padding: 14px 18px 16px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 2px;
    }
    .panel-title { margin: 0; font-size: 19px; font-weight: 600; }
    .panel-note { margin: 2px 0 0; color: var(--ink-muted); font: 13px var(--font-condensed); }
    .panel .section-title { margin: 14px 0 2px; }
    .panel-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
    .hints { margin: 12px 0 0; color: var(--ink-muted); font: 12px var(--font-condensed); line-height: 1.8; }

    .pick-row { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
    .pick-label { flex: 0 0 58px; color: var(--ink-muted); font: 12px var(--font-condensed); }
    .pick-items { display: flex; flex-wrap: wrap; gap: 6px; }
    .pick { flex-direction: column; gap: 0; height: auto; min-height: 32px; padding: 3px 10px; line-height: 1.25; }
    .pick small { font: 11px var(--font-condensed); opacity: .75; }
    .pick-detail { min-height: 34px; margin: 6px 0 0; color: var(--ink-muted); font: 13px var(--font-condensed); }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
    .card {
      position: relative;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 4px;
      height: auto;
      padding: 10px 12px 12px;
      text-align: left;
      border: 1px solid var(--rule);
      border-top: 3px solid var(--rule);
    }
    .card:hover { background: var(--hover); opacity: 1; }
    .card kbd { position: absolute; top: 9px; right: 9px; }
    .card-name { font-size: 16px; font-weight: 600; }
    .card-value { font: 17px var(--font-figure); font-variant-numeric: tabular-nums; }
    .card-note { color: var(--ink-muted); font: 12px var(--font-condensed); line-height: 1.3; }
    .card-synergy { color: var(--red-pencil); font: 600 12px var(--font-condensed); line-height: 1.3; }

    .cards.single { max-width: 300px; margin-inline: auto; }

    .card.phys { border-top-color: var(--orange-pen); }
    .card.magic { border-top-color: var(--violet); }
    .card.hero, .card.hybrid { border-top-color: var(--green-ink); }
    .stamp.phys { color: var(--orange-pen); }
    .stamp.magic { color: var(--violet); }
    .stamp.hero, .stamp.hybrid { color: var(--green-ink); }

    .card.grey { border-top-color: var(--ink-muted); }
    .card.blue { border-top-color: var(--blue-pen); }
    .card.purple { border-top-color: var(--violet); }
    .card.legendary { border-top-color: var(--highlighter); }
    .stamp.grey, .item-name.grey { color: var(--ink-muted); }
    .stamp.blue, .item-name.blue { color: var(--blue-pen); }
    .stamp.purple, .item-name.purple { color: var(--violet); }
    .stamp.legendary { color: var(--highlighter); }
    .item-name.legendary { background: var(--highlighter); background: color-mix(in srgb, var(--highlighter) 35%, transparent); }

    .item-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 3px 0; border-bottom: 1px solid var(--rule); }
    .item-name { font-size: 13px; font-weight: 600; }
    .item-text { color: var(--ink-muted); font: 12px var(--font-condensed); }

    .figures { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 10px; }
    .figures .label { display: block; }
    .report { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0 28px; }
    .report .row { padding: 3px 0; font-size: 13px; font-variant-numeric: tabular-nums; }

    .sim-scroll { overflow-x: auto; margin-top: 10px; }
    .sim-table { width: 100%; border-collapse: collapse; font: 12px var(--font-condensed); font-variant-numeric: tabular-nums; }
    .sim-table th, .sim-table td { padding: 3px 6px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
    .sim-table th { color: var(--ink-muted); font-weight: 400; }

    @media (max-width: 560px) {
      .page { padding: 6px 8px 8px; }
      .app-header { margin-bottom: 6px; padding-bottom: 6px; }
      .panel { padding: 12px; }
      .pick-row { display: block; }
      .pick-label { display: block; margin-bottom: 3px; }
      .active-btn { width: 76px; height: 76px; }
      .card kbd { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div>
        <a class="back-link" href="../../index.html">&larr; Game Nexus</a>
        <h1 class="app-title">Steel &amp; Spell</h1>
        <div class="app-status" id="status"></div>
      </div>
      <div class="theme-controls"></div>
    </header>

    <main class="stage" id="stage">
      <canvas id="view"></canvas>
      <button class="corner-btn" id="pause-btn" hidden>Pause</button>
      <button class="active-btn" id="active-btn" hidden>
        <span id="active-name"></span>
        <span class="time" id="active-time"></span>
      </button>
      <div class="overlay" id="overlay">
        <div class="panel" id="panel"></div>
      </div>
    </main>
  </div>

  <script src="js/data/config.js"></script>
  <script src="js/data/weapons.js"></script>
  <script src="js/data/enemies.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/core.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/attacks.js"></script>
  <script src="js/auras.js"></script>
  <script src="js/beams.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/render.js"></script>
  <script src="js/render-fx.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
